name: CI

# The application is developed on macOS and has never been executed on Linux or
# Windows. Everything except reading a .wiff is platform-neutral Python, so the
# whole suite runs on all three here — which is what stops the two untried
# platforms from drifting further out of reach.

on:
  push:
    branches: [main]
    # tagging is the release action: it is what builds the three installers.
    # Without this the package job below could never fire, because its own
    # condition asks for a ref the workflow was never started for.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}${{ matrix.unstable && ' (known unstable)' || '' }}
    runs-on: ${{ matrix.os }}
    # Linux reports without blocking. It segfaults inside pyqtgraph's own
    # PlotWidget constructor, in a different test on each run, under both the
    # offscreen platform and xvfb, on 3.10 and on 3.13. That is an open bug,
    # not a passing platform, and the README says as much — but holding the
    # macOS and Windows installers hostage to it helps nobody. This must not
    # be extended to either of those two.
    continue-on-error: ${{ matrix.unstable || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.13"
            unstable: true
          # the floor declared in pyproject, so it stays true
          - os: ubuntu-latest
            python: "3.10"
            unstable: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PyQt6 needs these even under the offscreen platform: they are linked at
      # import, not at window creation, so without them the import itself fails
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # Linux gets a real X server rather than Qt's offscreen platform.
      # offscreen crashed inside pg.PlotWidget's own constructor — a segfault
      # with no Python frame under it, in different tests from run to run —
      # and the same construction is fine under xvfb and on the other two
      # systems. macOS and Windows stay offscreen, where they are steady.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest -q
          else
            QT_QPA_PLATFORM=offscreen python -m pytest -q
          fi

      # its own process, and its own step per system: Windows is steady
      # under offscreen and Linux is not, and forcing one shell on both was
      # itself enough to change the answer once.
      - name: The app starts
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler tests/smoke_start.py

      - name: The app starts
        if: runner.os == 'Linux'
        run: xvfb-run -a python -X faulthandler tests/smoke_start.py

  wiff:
    # Reading a .wiff is the one platform-specific path: it loads SCIEX's
    # managed assemblies through a .NET runtime, by a different route on
    # Windows than on macOS and Linux. This reports whether the runtime and the
    # assemblies come up at all, which is as far as CI can go without a raw
    # file — those are not in the repository.
    name: .NET bootstrap · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Load the SCIEX libraries
        run: |
          python -c "
          import platform
          from openquant import bootstrap
          print('system:', platform.system())
          print('dotnet root:', bootstrap.find_dotnet_root())
          bootstrap.ensure()
          print('Clearcore2 loaded')
          "

  package:
    # One artefact per system, each built on its own runner: there is no cross
    # compilation for this, and a bundle is the interpreter plus every compiled
    # extension for that machine.
    #
    # Nothing is signed. On macOS that costs nothing until the file travels —
    # Gatekeeper reacts to the quarantine attribute a download attaches, not to
    # the absence of a signature. On Windows SmartScreen will warn until there
    # is a certificate.
    name: Package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # needed to create the release and hang the installers off it
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build
        run: python -m PyInstaller packaging/openquant.spec --noconfirm

      # the bundle either reads a .wiff or it does not, and this is the only
      # way to find out without a person and a mouse
      - name: The bundle works
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            QT_QPA_PLATFORM=offscreen dist/OpenQuant.app/Contents/MacOS/OpenQuant --selftest
          elif [ "$RUNNER_OS" = "Windows" ]; then
            QT_QPA_PLATFORM=offscreen ./dist/OpenQuant/OpenQuant.exe --selftest
          else
            xvfb-run -a ./dist/OpenQuant/OpenQuant --selftest
          fi

      - name: Disk image
        if: runner.os == 'macOS'
        run: bash packaging/make_dmg.sh "$PWD/dist"

      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = (Select-String -Path openquant/__init__.py `
            -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          wix build packaging/openquant.wxs -d Version=$version `
            -d BundleDir="$PWD\dist\OpenQuant" `
            -o "dist/OpenQuant-$version-windows-x64.msi"

      - name: Tarball
        if: runner.os == 'Linux'
        run: |
          version=$(python -c "import openquant; print(openquant.__version__)")
          tar -C dist -czf "dist/OpenQuant-$version-linux-x86_64.tar.gz" OpenQuant

      # WiX built a 36 KB installer once and called it a success, because a
      # glob that matches nothing is not an error. Every installer here holds
      # a Python interpreter, Qt and numpy; anything under 20 MB is empty.
      - name: The installer is not empty
        shell: bash
        run: |
          shopt -s nullglob
          built=(dist/*.dmg dist/*.msi dist/*.tar.gz)
          [ ${#built[@]} -gt 0 ] || { echo "nothing was built" >&2; exit 1; }
          status=0
          for file in "${built[@]}"; do
            size=$(wc -c < "$file")
            printf '%s %s bytes\n' "$file" "$size"
            [ "$size" -ge 20000000 ] || { echo "  too small to hold an app" >&2; status=1; }
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: openquant-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.msi
            dist/*.tar.gz
          if-no-files-found: error

      # a build artefact expires; a release does not, and it is the only copy
      # anyone else can be pointed at
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # each runner has only its own installer, and whichever of the three
          # arrives first is the one that creates the release
          shopt -s nullglob
          built=(dist/*.dmg dist/*.msi dist/*.tar.gz)
          [ ${#built[@]} -gt 0 ] || { echo "nothing was built" >&2; exit 1; }
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            --title "OpenQuant ${GITHUB_REF_NAME}" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "${built[@]}" --clobber

  linux-crash:
    # A temporary investigation, not part of the gate. Answers two questions
    # about the Linux segfault in one run: whether it is accumulation, and
    # what the native stack looks like when it happens.
    name: Linux crash probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries and gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0 xvfb gdb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -c "import PyQt6.QtCore as c, pyqtgraph as pg; \
            print('Qt', c.QT_VERSION_STR, 'PyQt', c.PYQT_VERSION_STR, \
                  'pyqtgraph', pg.__version__)"

      - name: Widgets kept alive
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/linux_probe.py grow 400

      - name: Widgets created and destroyed
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/linux_probe.py churn 400

      - name: Widgets kept alive, under a real display
        continue-on-error: true
        run: xvfb-run -a python tools/linux_probe.py grow 400

      # the question the Python traceback cannot answer: what Qt was doing
      - name: Native backtrace from the suite
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          gdb --batch -ex run -ex "bt 40" -ex "info threads" \
            --args python -m pytest -q -p no:cacheprovider 2>&1 | tail -80

      # the backtrace says the crash is inside PyQt's own QObject.__getattr__,
      # reached by an ordinary hasattr. If that is so, hammering it should
      # reproduce it without any of this application's code.
      - name: Minimal reproduction
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/linux_probe.py getattr 200

      - name: The suite on the previous PyQt
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install "PyQt6==6.9.1" "PyQt6-Qt6==6.9.1" 2>&1 | tail -2
          python -c "import PyQt6.QtCore as c; print('now Qt', c.QT_VERSION_STR, \
            'PyQt', c.PYQT_VERSION_STR)"
          python -m pytest -q -p no:cacheprovider 2>&1 | tail -15
