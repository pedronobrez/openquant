[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openquant"
# read from openquant/__init__.py: a version written twice is a version that
# will disagree with itself at the first bump
dynamic = ["version"]
description = "Open source quantitation and review for SCIEX LC-MS data (.wiff)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "alpharaw>=0.7",
    "pythonnet>=3.0",
    "certifi",
]

[project.scripts]
openquant = "openquant.app:main"

[tool.setuptools.dynamic]
version = { attr = "openquant.__version__" }

[tool.setuptools.packages.find]
include = ["openquant*"]

[tool.setuptools.package-data]
openquant = ["help/pages/*.md"]
