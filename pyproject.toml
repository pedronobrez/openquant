[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openquant"
version = "0.5.0"
description = "Open source quantitation and review for SCIEX LC-MS data (.wiff)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "alpharaw>=0.7",
    "pythonnet>=3.0",
    "certifi",
]

[project.scripts]
openquant = "openquant.app:main"

[tool.setuptools.packages.find]
include = ["openquant*"]
